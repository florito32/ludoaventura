<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aventura — Ludoaventura, jeu éducatif d'aventure</title>
  <meta name="description" content="Aventura : jeu éducatif d'aventure en équipe. Avancez sur le plateau du départ jusqu'au volcan et cumulez assez de points pour finir l'aventure.">
  <link rel="canonical" href="https://florito32.github.io/ludoaventura/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aventura — jeu éducatif d'aventure">
  <meta property="og:description" content="Avancez sur le plateau du départ jusqu'au volcan et cumulez assez de points en équipe pour finir l'aventure.">
  <meta property="og:url" content="https://florito32.github.io/ludoaventura/">
  <meta property="og:image" content="https://florito32.github.io/ludoaventura/icons/icon-512.png">
  <meta property="og:locale" content="fr_FR">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#3f7a46">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Aventura">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Les illustrations de l'accueil sont chargées en priorité. -->
  <link rel="preload" as="image" href="img/fond.webp" type="image/webp">
  <link rel="preload" as="image" href="img/arche.webp" type="image/webp">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
<a class="skip" href="#contenu">Aller au contenu</a>

<main id="contenu" tabindex="-1">

  <!-- ÉCRAN 1 : accueil, composé comme la boîte du jeu (décor, arche, aventurier, herbes) -->
  <section class="ecran accueil" id="ecran-accueil" aria-labelledby="titre-accueil">
    <h1 id="titre-accueil" class="visually-hidden">Aventura</h1>
    <div class="scene">
      <img class="calque arche" src="img/arche.webp" alt="Arche de pierre sculptée portant le mot « Aventura »" width="1368" height="879">
      <img class="calque perso" src="img/perso.webp" alt="" width="495" height="1065">
      <img class="calque herbe" src="img/herbe.webp" alt="" width="531" height="779">
      <div class="accueil-actions">
        <p class="accroche">Un jeu éducatif d'aventure, à jouer en équipe</p>
        <button type="button" class="btn btn-principal" id="btn-commencer">Commencer l'aventure</button>
      </div>
    </div>
  </section>

  <!-- ÉCRAN 2 : le plateau de jeu -->
  <section class="ecran plateau-ecran" id="ecran-plateau" aria-labelledby="titre-plateau" hidden>
    <header class="barre">
      <button type="button" class="btn-retour" id="btn-accueil"><span aria-hidden="true">←</span> Accueil</button>
      <h2 id="titre-plateau">Le plateau</h2>
      <span class="barre-vide" aria-hidden="true"></span>
    </header>

    <div class="table">
      <!-- Plateau illustré + pions posés sur les cases (positions en % de l'image, voir js/plateau.js) -->
      <figure class="plateau" id="plateau">
        <img id="plateau-img" src="img/plateau-jour.webp" width="1600" height="1071"
             alt="Plateau d'Aventura : un chemin part de la flèche DÉPART, passe par une croix dans la prairie, le pont sur le lac, le marais et les collines, et finit au volcan, case ARRIVÉE. Au centre, un parchemin MISSION.">
        <ol class="cases" id="cases" aria-label="Cases du parcours"></ol>
        <div class="pions" id="pions" aria-hidden="true"></div>
      </figure>

      <aside class="panneau" aria-label="Table de jeu">
        <div class="bloc points">
          <h3>Points de l'équipe</h3>
          <p class="points-valeur"><span id="points">0</span></p>
          <p class="points-objectif">Objectif : indiqué par la carte AVENTURE</p>
        </div>

        <div class="bloc">
          <h3>Joueurs</h3>
          <ul class="joueurs" id="joueurs"></ul>
        </div>

        <div class="bloc">
          <h3>Les dés</h3>
          <div class="des">
            <figure class="de-fig">
              <span class="de" aria-hidden="true"><i></i><i></i><i></i></span>
              <figcaption>Dé <strong>FAIBLE</strong></figcaption>
            </figure>
            <figure class="de-fig">
              <span class="de de-fort" aria-hidden="true"><i></i><i></i><i></i></span>
              <figcaption>Dé <strong>FORT</strong></figcaption>
            </figure>
          </div>
        </div>

        <div class="bloc">
          <h3>Les cartes</h3>
          <ul class="cartes">
            <li class="pile pile-aventure"><span class="carte" aria-hidden="true"></span>AVENTURE</li>
            <li class="pile pile-rouge"><span class="carte" aria-hidden="true"></span>JEU rouge</li>
            <li class="pile pile-jaune"><span class="carte" aria-hidden="true"></span>JEU jaune</li>
            <li class="pile pile-bleue"><span class="carte" aria-hidden="true"></span>JEU bleu</li>
          </ul>
        </div>

        <div class="bloc">
          <h3 id="ambiance-titre">Ambiance</h3>
          <div class="ambiance" role="group" aria-labelledby="ambiance-titre">
            <button type="button" class="ambiance-btn" data-ambiance="jour" aria-pressed="true">Jour</button>
            <button type="button" class="ambiance-btn" data-ambiance="soir" aria-pressed="false">Soir</button>
          </div>
        </div>
      </aside>
    </div>
  </section>
</main>

<footer class="pied">
  <p>Ludoaventura · Aventura <span data-version></span></p>
</footer>

<script src="js/plateau.js"></script>
<script src="js/version.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
