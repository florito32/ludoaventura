<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- Aventure « Préhistoire » : feu de camp au fond d'une caverne, deux silex au premier plan.
       Illustration originale (la photo des anciens livrets n'est pas libre de droits). -->
  <defs>
    <radialGradient id="lueur" cx="50%" cy="72%" r="60%">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".35" stop-color="#a4572a"/>
      <stop offset="1" stop-color="#2a1a14"/>
    </radialGradient>
    <linearGradient id="flamme" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e3262a"/>
      <stop offset=".55" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ffe600"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#lueur)"/>
  <!-- Voûte de la caverne -->
  <path d="M0 0 H640 V150 C590 90 520 60 440 70 C380 30 260 30 200 70 C120 60 50 100 0 160 Z" fill="#1d120d"/>
  <path d="M0 400 V300 C80 280 160 300 220 320 H420 C480 300 560 280 640 300 V400 Z" fill="#3a2418"/>
  <!-- Peintures rupestres -->
  <g fill="none" stroke="#e8a35c" stroke-width="5" stroke-linecap="round" opacity=".85">
    <path d="M90 170 c20 -18 50 -18 70 0 M100 170 v22 M150 170 v22 M160 165 l12 -10 M85 168 l-8 -8"/>
    <path d="M500 150 c18 -14 44 -14 60 0 M508 150 v20 M552 150 v20 M565 146 l10 -12"/>
    <path d="M470 205 l-30 30 M462 213 l-14 -4"/>
  </g>
  <!-- Bûches et pierres du foyer -->
  <g stroke="#1d120d" stroke-width="5" stroke-linejoin="round">
    <rect x="250" y="300" width="140" height="22" rx="10" fill="#7a4b22" transform="rotate(-12 320 311)"/>
    <rect x="250" y="300" width="140" height="22" rx="10" fill="#8a5a2b" transform="rotate(12 320 311)"/>
    <ellipse cx="240" cy="330" rx="26" ry="16" fill="#8b8b83"/>
    <ellipse cx="400" cy="330" rx="26" ry="16" fill="#9a9a90"/>
    <ellipse cx="320" cy="340" rx="28" ry="14" fill="#7d7d76"/>
  </g>
  <!-- Flammes -->
  <path d="M320 140 C350 190 380 210 372 262 C366 300 274 300 268 262 C262 222 300 210 296 180 C312 200 318 214 316 232 C328 206 330 176 320 140 Z"
        fill="url(#flamme)" stroke="#1d120d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M322 210 C338 236 346 252 340 270 C334 288 304 288 300 270 C296 252 312 242 322 210 Z" fill="#ffe600"/>
  <!-- Silex -->
  <g stroke="#1d120d" stroke-width="5" stroke-linejoin="round">
    <path d="M90 360 l30 -40 l38 8 l12 34 l-34 18 Z" fill="#b6b9b4"/>
    <path d="M520 365 l20 -44 l40 0 l10 36 l-40 22 Z" fill="#a7aaa4"/>
  </g>
  <g fill="#ffe600"><circle cx="186" cy="320" r="4"/><circle cx="200" cy="300" r="3"/><circle cx="470" cy="318" r="4"/></g>
</svg>
